services:
  db:
    image: postgres:15-alpine
    hostname: db
    container_name: mbyte_container
    environment:
      - POSTGRES_USER=mbyte
      - POSTGRES_PASSWORD=Tagada54
      - POSTGRES_DB=mbyte
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./provisioning/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.11
  traefik:
    image: traefik:v3.3
    hostname: proxy
    container_name: mbyte_proxy
    command: --api.insecure=true --providers.docker --providers.docker.network=mbyte_network
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.2
    labels:
      - "traefik.http.routers.redirect.rule=PathPrefix(`/`)"
      - "traefik.http.routers.redirect.entrypoints=http"
      - "traefik.http.routers.redirect.priority=1"
      - "traefik.http.routers.redirect.middlewares=redirect-www"
      - "traefik.http.middlewares.redirect-www.redirectregex.regex=^http://localhost(.*)"
      - "traefik.http.middlewares.redirect-www.redirectregex.replacement=http://www.mbyte.fr$$1"
      - "traefik.http.middlewares.redirect-www.redirectregex.permanent=true"

  consul:
    image: hashicorp/consul:1.19
    hostname: consul
    container_name: mbyte_registry
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0 -log-level=info
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.10
        aliases:
          - consul

  keycloak:
    build:
      context: ./auth
      dockerfile: Dockerfile
    hostname: auth
    container_name: mbyte_auth
    command: start --optimized --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Tagada54
      KC_DB_URL: jdbc:postgresql://db/keycloak
      KC_DB_USERNAME: mbyte
      KC_DB_PASSWORD: Tagada54
      KC_HOSTNAME: auth.mbyte.fr
      KC_HTTP_PORT: 80
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mbyte_network"
      - "traefik.http.routers.keycloak.rule=Host(`auth.mbyte.fr`)"
      - "traefik.http.routers.keycloak.entrypoints=http"
      - "traefik.http.routers.keycloak.service=keycloak-http"
      - "traefik.http.services.keycloak-http.loadbalancer.server.port=80"
    restart: always
    depends_on:
      - db
      - traefik
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.12
        aliases:
          - auth.mbyte.fr

  manager:
    build:
      context: ./manager
      dockerfile: src/main/docker/Dockerfile.jvm
    image: abdelkader2020/manager:25.1
    hostname: manager
    container_name: mbyte_manager
    user: "0:0"
    restart: always
    depends_on:
      - db
      - traefik
      
      - keycloak
      - consul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.13
    extra_hosts:
      - "consul:172.25.0.10"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mbyte_network"
      - "traefik.http.routers.manager.rule=Host(`www.mbyte.fr`)"
      - "traefik.http.routers.manager.entrypoints=http"
      - "traefik.http.routers.manager.service=manager-http"
      - "traefik.http.services.manager-http.loadbalancer.server.port=8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://auth.mbyte.fr/realms/mbyte
      - MANAGER.TOPOLOGY.HOST=consul
      - MANAGER.TOPOLOGY.PORT=8500

  store:
    build:
      context: ./store
      dockerfile: src/main/docker/Dockerfile.jvm
    image: abdelkader2020/store:25.1
    hostname: sheldon
    container_name: mbyte_store_sheldon
    depends_on:
      - db
      - traefik
      - keycloak
      - consul
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.14
    extra_hosts:
      - "consul:172.25.0.10"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mbyte_network"
      - "traefik.http.routers.sheldon.rule=Host(`sheldon.s.mbyte.fr`)"
      - "traefik.http.routers.sheldon.entrypoints=http"
      - "traefik.http.routers.sheldon.service=sheldon-http"
      - "traefik.http.services.sheldon-http.loadbalancer.server.port=8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://auth.mbyte.fr/realms/mbyte
      - MANAGER.TOPOLOGY.HOST=consul
      - MANAGER.TOPOLOGY.PORT=8500
      - STORE_AUTH_OWNER=abdelkaderb
      - QUARKUS_CONFIG_LOCATIONS=/deployments/config/application.properties

  dns:
    image: coredns/coredns:1.11.1
    hostname: dns
    container_name: mbyte_dns
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    networks:
      mbyte_network:
        ipv4_address: 172.25.0.53
    restart: always

networks:
  mbyte_network:
    name: mbyte_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/24

volumes:
  postgres-data:
